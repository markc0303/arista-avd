---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 10.255.0.0/27
    loopback_ipv4_offset: 2
    vtep_loopback_ipv4_pool: 10.255.1.0/27
    uplink_switches: ['dc1-spine1', 'dc1-spine2']
    uplink_ipv4_pool: 10.1.0.0/26
    mlag_peer_ipv4_pool: 10.255.1.64/27
    mlag_peer_l3_ipv4_pool: 10.255.1.96/27
    virtual_router_mac_address: 00:1c:73:00:00:99
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp
    raw_eos_cli: load-interval default 1 
    
  node_groups:    
    - group: DC1_L3_LEAF1
      bgp_as: 65101
      nodes:
        - name: dc1-leaf1a
          id: 1
          mgmt_ip: 172.16.93.101/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet1, Ethernet1]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ]
          mlag_interfaces: [ Ethernet3-4 ]
        - name: dc1-leaf1b
          id: 2
          mgmt_ip: 172.16.93.102/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet2, Ethernet2 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ]
          mlag_interfaces: [ Ethernet3-4 ]
          bgp_as: 65101

    - group: DC1_L3_LEAF2
      bgp_as: 65102
      nodes:
        - name: dc1-leaf2a
          id: 3
          mgmt_ip: 172.16.93.103/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet3, Ethernet3 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ] 
          mlag_interfaces: [ Ethernet3-4 ]         
        - name: dc1-leaf2b
          id: 4
          mgmt_ip: 172.16.93.104/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet4, Ethernet4 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ] 
          mlag_interfaces: [ Ethernet3-4 ]            

    - group: DC1_L3_LEAF3
      bgp_as: 65103
      nodes:
        - name: dc1-leaf3a
          id: 5
          mgmt_ip: 172.16.93.105/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet5, Ethernet5 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ] 
          mlag_interfaces: [ Ethernet3-4 ]         
        - name: dc1-leaf3b
          id: 6
          mgmt_ip: 172.16.93.106/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet6, Ethernet6 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ] 
          mlag_interfaces: [ Ethernet3-4 ]  