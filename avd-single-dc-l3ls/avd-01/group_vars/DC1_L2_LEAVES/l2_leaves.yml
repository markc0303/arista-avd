---
type: l2leaf
l2leaf:
  defaults:
    spanning_tree_mode: mstp

  node_groups:
    - group: DC1_L2_LEAF1
      uplink_switches: [dc1-leaf1a, dc1-leaf1b]
      uplink_switch_interfaces: [ Ethernet8, Ethernet8]
      uplink_interfaces: [ Ethernet1, Ethernet2 ]
      nodes:
        - name: dc1-leaf1c
          id: 1
          mgmt_ip: 172.16.93.151/24
    - group: DC1_L2_LEAF2
      uplink_switches: [dc1-leaf2a, dc1-leaf2b]
      uplink_switch_interfaces: [ Ethernet8, Ethernet8]
      uplink_interfaces: [ Ethernet1, Ethernet2 ]
      nodes:
        - name: dc1-leaf2c
          id: 1
          mgmt_ip: 172.16.93.152/24
    - group: DC1_L2_LEAF3
      uplink_switches: [dc1-leaf3a, dc1-leaf3b]
      uplink_switch_interfaces: [ Ethernet8, Ethernet8]
      uplink_interfaces: [ Ethernet1, Ethernet2 ]
      nodes:
        - name: dc1-leaf3c
          id: 1
          mgmt_ip: 172.16.93.153/24