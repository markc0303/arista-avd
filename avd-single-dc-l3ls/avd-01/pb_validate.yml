---
- name: Validate Network State
  hosts: DC1_L3_LEAVES 
  connection: httpapi
  gather_facts: false

  tasks:

    - name: validate states on EOS devices
      ansible.builtin.import_role:
        name: arista.avd.anta_runner 
      ignore_errors: true   
      vars:
        avd_catalogs_filters: 
          - skip_tests: [VerifyMemoryUtilization, VerifyLoggingErrors, VerifyInterfaceDiscards, VerifyFileSystemUtilization, VerifyNTP]