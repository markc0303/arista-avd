aaa_root:
  disabled: true
clock:
  timezone: Asia/Taipei
config_end: true
enable_password:
  disabled: true
eos_cli: load-interval default 1
ethernet_interfaces:
- name: Ethernet53/1
  description: MLAG_dc1-leaf3b_Ethernet53/1
  shutdown: false
  channel_group:
    id: 531
    mode: active
  metadata:
    peer: dc1-leaf3b
    peer_interface: Ethernet53/1
    peer_type: mlag_peer
- name: Ethernet54/1
  description: MLAG_dc1-leaf3b_Ethernet54/1
  shutdown: false
  channel_group:
    id: 531
    mode: active
  metadata:
    peer: dc1-leaf3b
    peer_interface: Ethernet54/1
    peer_type: mlag_peer
- name: Ethernet49/1
  description: P2P_dc1-spine1_Ethernet2/1
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  ip_address: 10.255.255.25/31
  metadata:
    peer: dc1-spine1
    peer_interface: Ethernet2/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet50/1
  description: P2P_dc1-spine2_Ethernet2/1
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  ip_address: 10.255.255.27/31
  metadata:
    peer: dc1-spine2
    peer_interface: Ethernet2/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet51/1
  description: P2P_dc1-spine3_Ethernet2/1
  shutdown: false
  speed: forced 100gfull
  mtu: 9214
  ip_address: 10.255.255.29/31
  metadata:
    peer: dc1-spine3
    peer_interface: Ethernet2/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet1
  description: SERVER_dc1-leaf3-server1_PCI1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: dc1-leaf3-server1
    peer_interface: PCI1
    peer_type: server
    peer_key: servers
hostname: dc1-leaf3a
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 192.168.1.1
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$hRPpt0mRKg1IbLxq$zuZlB/ozlYBXH6ObqfpWavwOnVRwRJMb5tL/PjjXWUdG0osH2RadZBsPvUDUiqP8DAJ34E4hPky5xAhzvkMH40
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$GX5WBIf4Gt/N8VVV$sJGc.25dcxHjMa5DiyFd/BQEs/olKOzvyHiELq0HYFJlc905Fet16XF3lbNBDllpldRlRU0q27SQm4dsg7f9h/
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.8/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.8/32
- name: Loopback10
  description: DIAG_VRF_VRF10
  shutdown: false
  vrf: VRF10
  ip_address: 10.255.10.8/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.93.105/24
  type: oob
  gateway: 172.16.93.1
metadata:
  is_deployed: true
  platform: 7050X3
  fabric_name: FABRIC
mlag_configuration:
  domain_id: DC1_L3_LEAF3
  local_interface: Vlan4094
  peer_address: 10.255.1.73
  peer_link: Port-Channel531
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel531
  description: MLAG_dc1-leaf3b_Port-Channel531
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel1
  description: SERVER_dc1-leaf3-server1
  shutdown: false
  mlag: 1
  spanning_tree_portfast: edge
  switchport:
    enabled: true
    mode: access
    access_vlan: 10
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/26 eq 32
  - sequence: 20
    action: permit 10.255.1.0/27 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.1.104/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65103'
  router_id: 10.255.0.8
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65103'
    description: dc1-leaf3b
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.1.105
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: dc1-leaf3b
    description: dc1-leaf3b_Vlan4093
  - ip_address: 10.255.255.24
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Ethernet2/1
  - ip_address: 10.255.255.26
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Ethernet2/1
  - ip_address: 10.255.255.28
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine3
    description: dc1-spine3_Ethernet2/1
  - ip_address: 10.255.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.255.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  - ip_address: 10.255.0.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine3
    description: dc1-spine3_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 10
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.0.8:10010
    route_targets:
      both:
      - 10010:10010
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: VRF10
    rd: 10.255.0.8:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.255.0.8
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.255.1.105
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: dc1-leaf3b_Vlan3009
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: 4093-4094
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.16.93.1
transceiver_qsfp_default_mode_4x10: true
virtual_source_nat_vrfs:
- name: VRF10
  ip_address: 10.255.10.8
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.255.1.104/31
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.255.1.72/31
  mtu: 9214
  no_autostate: true
- name: Vlan10
  description: VRF10_VLAN10
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.10.1/24
  metadata:
    tenants:
    - TENANT1
- name: Vlan3009
  description: MLAG_L3_VRF_VRF10
  shutdown: false
  vrf: VRF10
  ip_address: 10.255.1.104/31
  mtu: 9214
  metadata:
    tenants:
    - TENANT1
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 10
  name: VRF10_VLAN10
  metadata:
    tenants:
    - TENANT1
- id: 3009
  name: MLAG_L3_VRF_VRF10
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TENANT1
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ip_routing: true
  metadata:
    tenants:
    - TENANT1
vxlan_interface:
  vxlan1:
    description: dc1-leaf3a_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
      vlans:
      - id: 10
        vni: 10010
      vrfs:
      - name: VRF10
        vni: 10
