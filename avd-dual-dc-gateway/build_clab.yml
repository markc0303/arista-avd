---
- name: Generate Containerlab Topology from AVD Structured Configs
  hosts: FABRIC
  connection: local
  gather_facts: false
  vars:
    fabric_group: FABRIC
    ceos_image: "ceos:4.32.0F"
    clab_mgmt_subnet: "172.20.20.0/24"

  tasks:
    - name: Load AVD structured configuration for each host
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/intended/structured_configs/{{ inventory_hostname }}.yml"
        name: avd_structured_config

    - name: Render Containerlab topology YAML
      ansible.builtin.template:
        src: "{{ inventory_dir }}/templates/clab_topology.j2"
        dest: "{{ inventory_dir }}/topology.clab.yml"
        mode: "0644"
      delegate_to: localhost
      run_once: true
