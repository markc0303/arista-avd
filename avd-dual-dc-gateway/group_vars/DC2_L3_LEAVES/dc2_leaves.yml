---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 10.255.201.0/24
    loopback_ipv4_offset: 3
    vtep_loopback_ipv4_pool: 10.255.202.0/24
    uplink_switches: ['dc2-spine1', 'dc2-spine2']
    uplink_ipv4_pool: 10.255.203.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    virtual_router_mac_address: 00:1c:73:00:00:bb
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp
    raw_eos_cli: load-interval default 1 
    mgmt_interface: Management0

  node_groups:    
    - group: DC2_L3_LEAF1
      bgp_as: 65201
      nodes:
        - name: dc2-leaf1a
          id: 1
          mgmt_ip: 172.20.96.201/24
          uplink_switches: [ dc2-spine1, dc2-spine2 ]
          uplink_switch_interfaces: [ Ethernet1, Ethernet1 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ]
          mlag_interfaces: [ Ethernet3-4 ]
        - name: dc2-leaf1b
          id: 2
          mgmt_ip: 172.20.96.202/24
          uplink_switches: [ dc2-spine1, dc2-spine2 ]
          uplink_switch_interfaces: [ Ethernet2, Ethernet2 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ]
          mlag_interfaces: [ Ethernet3-4 ]
          bgp_as: 65101

    - group: DC2_L3_LEAF2
      bgp_as: 65202
      nodes:
        - name: dc2-leaf2a
          id: 3
          mgmt_ip: 172.20.96.203/24
          uplink_switches: [ dc2-spine1, dc2-spine2 ]
          uplink_switch_interfaces: [ Ethernet3, Ethernet3 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ] 
          mlag_interfaces: [ Ethernet3-4 ]         
        - name: dc2-leaf2b
          id: 4
          mgmt_ip: 172.20.96.204/24
          uplink_switches: [ dc2-spine1, dc2-spine2 ]
          uplink_switch_interfaces: [ Ethernet4, Ethernet4 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ] 
          mlag_interfaces: [ Ethernet3-4 ]            

    - group: DC2_BORDERLEAF1
      bgp_as: 65222
      nodes:
        - name: dc2-borderleaf1
          id: 5
          mgmt_ip: 172.20.96.205/24
          uplink_switches: [ dc2-spine1, dc2-spine2 ]
          uplink_switch_interfaces: [ Ethernet5, Ethernet5 ]
          uplink_interface_speed: "forced 100gfull"
          uplink_interfaces: [ Ethernet1, Ethernet2 ] 
          mlag: false
          platform: cEOSLab       
          evpn_gateway:
            remote_peers:
              - hostname: dc2-borderleaf1
                ip_address: 10.255.101.8
                bgp_as: 65111
            evpn_l2:
              enabled: true
            evpn_l3:
              enabled: true
              # mode: "rd-rt-rewrite"
                 
                             
    
 