# Set default uplink, downlink, and MLAG interfaces based on node type
default_interfaces:
  - types: [spine]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    downlink_interfaces: [Ethernet1-8]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    # mlag_interfaces: [Ethernet3-4]
    downlink_interfaces: [Ethernet8]
  - types: [l2leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    
mgmt_interface: Management1
mgmt_interface_vrf: MGMT    

management_eapi:
  enable_https: true
  
# CloudVision Portal definitions
# cv_settings:
#   onprem_clusters:
#     - name: primary
#       servers:
#         - name: 192.168.1.12
#   terminattr:
#     disable_aaa: true

# DNS Server
dns_settings:
  servers:
    - ip_address: 192.168.1.1

# NTP Servers IP or DNS name, first NTP server will be preferred, and sourced from Management VRF
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 0.pool.ntp.org
    
timezone: Asia/Taipei    

 
