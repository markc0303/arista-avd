---
type: l3leaf
l3leaf:
  defaults:
    loopback_ipv4_pool: 10.255.0.0/26
    loopback_ipv4_offset: 3
    vtep_loopback_ipv4_pool: 10.255.1.0/27
    uplink_switches: ['dc1-spine1', 'dc1-spine2', 'dc1-spine3']
    uplink_switch_interface_speed: "100g-2"
    uplink_interface_speed: "forced 100gfull"
    uplink_ipv4_pool: 10.255.255.0/24
    mlag_peer_ipv4_pool: 10.255.1.64/27
    mlag_peer_l3_ipv4_pool: 10.255.1.96/27
    virtual_router_mac_address: 00:1c:73:00:00:99
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp
    raw_eos_cli: load-interval default 1 
    platform: 7050X3
    
  node_groups:    
    - group: DC1_L3_LEAF1
      bgp_as: 65101
      nodes:
        - name: dc1-leaf1a
          id: 1
          mgmt_ip: 172.16.93.101/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet1/1, Ethernet1/1]
          uplink_interfaces: [ Ethernet49/1, Ethernet50/1]
          mlag_interfaces: [ Ethernet53/1, Ethernet54/1 ]
        - name: dc1-leaf1b
          id: 2
          mgmt_ip: 172.16.93.102/24
          uplink_switches: [ dc1-spine1, dc1-spine2 ]
          uplink_switch_interfaces: [ Ethernet1/3, Ethernet1/3 ]
          uplink_interfaces: [ Ethernet49/1, Ethernet50/1 ]
          mlag_interfaces: [ Ethernet53/1, Ethernet54/1 ]
          bgp_as: 65101

    - group: DC1_L3_LEAF2
      bgp_as: 65102
      nodes:
        - name: dc1-leaf2a
          id: 3
          mgmt_ip: 172.16.93.103/24
          uplink_switches: [ dc1-spine1, dc1-spine2, dc1-spine3 ]
          uplink_switch_interfaces: [ Ethernet1/5, Ethernet1/5, Ethernet1/5 ]
          uplink_interfaces: [ Ethernet49/1, Ethernet50/1, Ethernet51/1 ]
          mlag_interfaces: [ Ethernet53/1, Ethernet54/1 ]         
        - name: dc1-leaf2b
          id: 4
          mgmt_ip: 172.16.93.104/24
          uplink_switches: [ dc1-spine1, dc1-spine2, dc1-spine3 ]
          uplink_switch_interfaces: [ Ethernet1/7, Ethernet1/7, Ethernet1/7 ]
          uplink_interfaces: [ Ethernet49/1, Ethernet50/1, Ethernet51/1 ]
          mlag_interfaces: [ Ethernet53/1, Ethernet54/1 ]           

    - group: DC1_L3_LEAF3
      bgp_as: 65103
      nodes:
        - name: dc1-leaf3a
          id: 5
          mgmt_ip: 172.16.93.105/24
          uplink_switches: [ dc1-spine1, dc1-spine2, dc1-spine3 ]
          uplink_switch_interfaces: [ Ethernet2/1, Ethernet2/1, Ethernet2/1 ]
          uplink_interfaces: [ Ethernet49/1, Ethernet50/1, Ethernet51/1 ]
          mlag_interfaces: [ Ethernet53/1, Ethernet54/1 ]         
        - name: dc1-leaf3b
          id: 6
          mgmt_ip: 172.16.93.106/24
          uplink_switches: [ dc1-spine1, dc1-spine2, dc1-spine3 ]
          uplink_switch_interfaces: [ Ethernet2/3, Ethernet2/3, Ethernet2/3 ]
          uplink_interfaces: [ Ethernet49/1, Ethernet50/1, Ethernet51/1 ]
          mlag_interfaces: [ Ethernet53/1, Ethernet54/1 ]