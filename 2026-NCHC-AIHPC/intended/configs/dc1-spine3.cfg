!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$hRPpt0mRKg1IbLxq$zuZlB/ozlYBXH6ObqfpWavwOnVRwRJMb5tL/PjjXWUdG0osH2RadZBsPvUDUiqP8DAJ34E4hPky5xAhzvkMH40
username arista privilege 15 role network-admin secret sha512 $6$GX5WBIf4Gt/N8VVV$sJGc.25dcxHjMa5DiyFd/BQEs/olKOzvyHiELq0HYFJlc905Fet16XF3lbNBDllpldRlRU0q27SQm4dsg7f9h/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-spine3
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 192.168.1.1
!
spanning-tree mode none
!
clock timezone Asia/Taipei
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1/1
   description P2P_dc1-leaf1a_Ethernet51/1
   no shutdown
   mtu 9214
   speed 100g-2
   no switchport
   ip address 10.255.255.4/31
!
interface Ethernet1/3
   description P2P_dc1-leaf1b_Ethernet51/1
   no shutdown
   mtu 9214
   speed 100g-2
   no switchport
   ip address 10.255.255.10/31
!
interface Ethernet1/5
   description P2P_dc1-leaf2a_Ethernet51/1
   no shutdown
   mtu 9214
   speed 100g-2
   no switchport
   ip address 10.255.255.16/31
!
interface Ethernet1/7
   description P2P_dc1-leaf2b_Ethernet51/1
   no shutdown
   mtu 9214
   speed 100g-2
   no switchport
   ip address 10.255.255.22/31
!
interface Ethernet2/1
   description P2P_dc1-leaf3a_Ethernet51/1
   no shutdown
   mtu 9214
   speed 100g-2
   no switchport
   ip address 10.255.255.28/31
!
interface Ethernet2/3
   description P2P_dc1-leaf3b_Ethernet51/1
   no shutdown
   mtu 9214
   speed 100g-2
   no switchport
   ip address 10.255.255.34/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.0.3/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.93.13/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/27 eq 32
!
ip route vrf MGMT 0.0.0.0/0 172.16.93.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org prefer
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.255.0.3
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.255.0.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.4 remote-as 65101
   neighbor 10.255.0.4 description dc1-leaf1a_Loopback0
   neighbor 10.255.0.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.5 remote-as 65101
   neighbor 10.255.0.5 description dc1-leaf1b_Loopback0
   neighbor 10.255.0.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.6 remote-as 65102
   neighbor 10.255.0.6 description dc1-leaf2a_Loopback0
   neighbor 10.255.0.7 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.7 remote-as 65102
   neighbor 10.255.0.7 description dc1-leaf2b_Loopback0
   neighbor 10.255.0.8 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.8 remote-as 65103
   neighbor 10.255.0.8 description dc1-leaf3a_Loopback0
   neighbor 10.255.0.9 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.9 remote-as 65103
   neighbor 10.255.0.9 description dc1-leaf3b_Loopback0
   neighbor 10.255.255.5 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.5 remote-as 65101
   neighbor 10.255.255.5 description dc1-leaf1a_Ethernet51/1
   neighbor 10.255.255.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.11 remote-as 65101
   neighbor 10.255.255.11 description dc1-leaf1b_Ethernet51/1
   neighbor 10.255.255.17 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.17 remote-as 65102
   neighbor 10.255.255.17 description dc1-leaf2a_Ethernet51/1
   neighbor 10.255.255.23 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.23 remote-as 65102
   neighbor 10.255.255.23 description dc1-leaf2b_Ethernet51/1
   neighbor 10.255.255.29 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.29 remote-as 65103
   neighbor 10.255.255.29 description dc1-leaf3a_Ethernet51/1
   neighbor 10.255.255.35 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.35 remote-as 65103
   neighbor 10.255.255.35 description dc1-leaf3b_Ethernet51/1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
load-interval default 1
!
end
